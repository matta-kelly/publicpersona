apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: publicpersona
  namespace: publicpersona
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: home.monk3y.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: publicpersona
                port:
                  number: 3000
