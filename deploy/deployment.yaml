apiVersion: apps/v1
kind: Deployment
metadata:
  name: publicpersona
  namespace: publicpersona
  labels:
    app.kubernetes.io/name: publicpersona
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: publicpersona
  template:
    metadata:
      labels:
        app.kubernetes.io/name: publicpersona
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: forgejo.monk3y.xyz/mkultra/publicpersona:sha-0000000  # bumped by CI
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: IMMICH_SHARE_KEY
              valueFrom:
                secretKeyRef:
                  name: immich-share
                  key: IMMICH_SHARE_KEY
            - name: FORGEJO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-api-token
                  key: FORGEJO_API_TOKEN
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
