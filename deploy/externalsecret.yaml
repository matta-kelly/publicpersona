apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-share
  namespace: publicpersona
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vaultwarden
  target:
    name: immich-share
  data:
    - secretKey: IMMICH_SHARE_KEY
      remoteRef:
        key: immich-publicpersona-share
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-api-token
  namespace: publicpersona
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vaultwarden
  target:
    name: forgejo-api-token
  data:
    - secretKey: FORGEJO_API_TOKEN
      remoteRef:
        key: forgejo-api-token
