name: checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push makes the older run's answer useless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # A named release: ubuntu-latest moves to a new one with no commit here.
    runs-on: ubuntu-24.04
    # A hung step has to fail the run; the ruleset on main waits on this job.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Before setup-node: its pnpm cache needs pnpm on the PATH to find the store.
      # corepack reads the version from packageManager in package.json.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The runner has pnpm and docker on the PATH; the defaults are for a dev machine.
      - run: ./check.sh
        env:
          PNPM: pnpm
          ENGINE: docker
