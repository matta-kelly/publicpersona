name: checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push makes the older run's answer useless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # A named release: ubuntu-latest moves to a new one with no commit here.
    runs-on: ubuntu-24.04
    # A hung step has to fail the run; the ruleset on main waits on this job.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # check.sh reads the files of the change from the merge base with main.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # corepack reads the version of pnpm from packageManager in package.json.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # check.sh says which steps this change needs: notes, unit or all.
      - id: plan
        run: echo "needs=$(./check.sh --plan)" >> "$GITHUB_OUTPUT"

      # The browser is part of the toolchain: check.sh drives it and installs nothing.
      # The tests run with no window, so the headless shell is the only build they start.
      - if: steps.plan.outputs.needs == 'all'
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # The runner has pnpm and docker on the PATH; the defaults are for a dev machine.
      - run: ./check.sh
        env:
          PNPM: pnpm
          ENGINE: docker
