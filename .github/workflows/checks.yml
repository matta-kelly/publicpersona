name: checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # A hung step has to fail the run; the ruleset on main waits on this job.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Before setup-node: its pnpm cache needs pnpm on the PATH to find the store.
      # corepack reads the version from packageManager in package.json.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
