name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]

env:
  REGISTRY: forgejo.monk3y.xyz
  IMAGE_NAME: mkultra/publicpersona

jobs:
  # ─── Validate — typecheck, lint, build ───────────────────────────────
  validate:
    runs-on: lotus-lake-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  # ─── Build — push container image ────────────────────────────────────
  build:
    needs: validate
    runs-on: lotus-lake-ci
    if: gitea.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ gitea.actor }} --password-stdin

      - name: Build image
        run: |
          SHORT_SHA=$(echo "${{ gitea.sha }}" | cut -c1-7)
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA} .
          # Separate tag step: the runner's docker is podman's compat API, which keeps only the
          # last of several -t flags on build.
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Push image
        run: |
          SHORT_SHA=$(echo "${{ gitea.sha }}" | cut -c1-7)
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # Deploy: none here. monkeybusiness runs this image as a Podman quadlet with
  # Image=...:latest + AutoUpdate=registry (dazoo nodes/mutable/monkeybusiness/publicpersona/),
  # so pushing :latest is the deploy. Roll back by pinning a sha-* tag in that quadlet.
